<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roblox Login Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #17191c;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box,
    .success-box {
      width: 390px;
      background: #24272b;
      border-radius: 10px;
      padding: 38px 34px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 25px;
    }

    .input {
      width: 100%;
      height: 48px;
      margin-bottom: 14px;
      padding: 0 14px;

      border: 1px solid #44484e;
      border-radius: 7px;

      background: #191b1e;
      color: white;

      font-size: 15px;
      outline: none;
    }

    .input::placeholder {
      color: #999;
    }

    .input:focus {
      border-color: #777;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 6px;

      border: none;
      border-radius: 7px;

      background: white;
      color: #17191c;

      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #e5e5e5;
    }

    .forgot {
      display: block;
      margin-top: 18px;

      color: #bdbdbd;
      text-decoration: none;
      font-size: 14px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;

      color: #777;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #3d4146;
    }

    .create-button {
      width: 100%;
      height: 46px;

      border: 1px solid #555;
      border-radius: 7px;

      background: transparent;
      color: white;

      font-size: 14px;
      cursor: pointer;
    }

    .demo {
      margin-top: 22px;
      color: #777;
      font-size: 11px;
    }

    .success-box {
      display: none;
    }

    .success-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .success-box h1 {
      margin-bottom: 12px;
    }

    .success-text {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .continue-button {
      width: 100%;
      height: 46px;

      border: none;
      border-radius: 7px;

      background: white;
      color: #17191c;

      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- PAGINA DE LOGIN -->
  <div class="login-box" id="loginPage">

    <h1>Log in to Roblox</h1>

    <input
      class="input"
      type="text"
      placeholder="Username"
      autocomplete="off"
    >

    <input
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button class="login-button" onclick="loginDemo()">
      Log In
    </button>

    <a class="forgot" href="#" onclick="return false;">
      Forgot Password or Username?
    </a>

    <div class="divider">
      OR
    </div>

    <button class="create-button" onclick="return false;">
      Create Account
    </button>

    <div class="demo">
      Demo neoficial — datele introduse nu sunt salvate sau trimise.
    </div>

  </div>


  <!-- PAGINA DE SUCCES -->
  <div class="success-box" id="successPage">

    <div class="success-icon">✓</div>

    <h1>Login Successful!</h1>

    <div class="success-text">
      Ai intrat cu succes în jocul demonstrativ.
    </
