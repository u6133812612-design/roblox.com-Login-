```html
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Login Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #17191c;
      color: #fff;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 390px;
      padding: 36px 34px;
      background: #24272b;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      margin-bottom: 25px;
      border-radius: 5px;
      background: #3a3e44;
      color: #c9c9c9;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 23px;
    }

    .input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      margin-bottom: 14px;

      border: 1px solid #44484e;
      border-radius: 7px;

      background: #191b1e;
      color: white;

      font-size: 15px;
      outline: none;
    }

    .input::placeholder {
      color: #999;
    }

    .input:focus {
      border-color: #777;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 5px;

      border: none;
      border-radius: 7px;

      background: white;
      color: #17191c;

      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #e5e5e5;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;

      color: #777;
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #3d4146;
    }

    .guest-button {
      width: 100%;
      height: 46px;

      border: 1px solid #555;
      border-radius: 7px;

      background: transparent;
      color: white;

      font-size: 14px;
      cursor: pointer;
    }

    .guest-button:hover {
      background: #2d3034;
    }

    .notice {
      margin-top: 20px;
      color: #888;
      font-size: 11px;
      line-height: 1.5;
    }

    .success {
      display: none;
    }

    .success-icon {
      font-size: 52px;
      margin-bottom: 12px;
    }

    .success p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
  </style>
</head>

<body>

  <!-- DEMO LOGIN -->
  <div class="card" id="loginPage">

    <div class="logo">GAME</div>

    <div class="badge">UNOFFICIAL DEMO</div>

    <h1>Log In</h1>

    <input
      id="username"
      class="input"
      type="text"
      placeholder="Username"
      autocomplete="off"
    >

    <button class="login-button" onclick="loginDemo()">
      Log In
    </button>

    <div class="divider">OR</div>

    <button class="guest-button" onclick="guestLogin()">
      Continue as Guest
    </button>

    <div class="notice">
      Demo interface only.<br>
      No passwords are requested, saved, or transmitted.
    </div>

  </div>


  <!-- SUCCESS -->
  <div class="card success" id="successPage">

    <div class="success-icon">✓</div>

    <h1>Welcome!</h1>

    <p id="welcomeText">
      Demo started successfully.
    </p>

    <button class="login-button" onclick="location.reload()">
      Back
    </button>

  </div>


  <script>
    function loginDemo() {
      const username =
        document.getElementById("username").value.trim();

      if (!username) {
        alert("Please enter a username.");
        return;
      }

      showSuccess(
        "Welcome, " + username + "! This is only a demo."
      );
    }

    function guestLogin() {
      showSuccess(
        "You entered the demo as a guest."
      );
    }

    function showSuccess(message) {
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("successPage").style.display = "block";
      document.getElementById("welcomeText").textContent = message;
    }
  </script>

</body>
</html>
```
