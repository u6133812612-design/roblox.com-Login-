<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Login</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #17191c;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 330px;
      padding: 32px;
      background: #24272b;
      border-radius: 10px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      height: 45px;
      margin-bottom: 14px;
      padding: 0 12px;
      box-sizing: border-box;
      border: 1px solid #444;
      border-radius: 6px;
      background: #191b1e;
      color: white;
    }

    button {
      width: 100%;
      height: 45px;
      border: 0;
      border-radius: 6px;
      background: white;
      font-weight: bold;
      cursor: pointer;
    }

    .demo {
      margin-top: 18px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login">
    <h1>Demo Login</h1>

    <form onsubmit="loginDemo(event)">
      <input
        id="username"
        type="text"
        placeholder="Username"
        autocomplete="off"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="off"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <div class="demo">
      DEMO — nu trimite date către un server.
    </div>
  </div>

  <script>
    function loginDemo(event) {
      event.preventDefault();

      alert("Demo login — datele nu au fost trimise.");
    }
  </script>

</body>
</html>
