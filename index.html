```html
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 330px;
      padding: 20px 14px 30px;
      text-align: center;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 31px;
      font-weight: 700;
    }

    .demo-text {
      margin: 0 0 12px;
      color: #aaa;
      font-size: 13px;
    }

    input {
      width: 100%;
      height: 38px;
      margin: 8px 0;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid #50535d;
      background: #343740;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #e5e5e5;
    }

    input:focus {
      border-color: #aaa;
    }

    .login-btn {
      width: 100%;
      height: 37px;
      margin-top: 0;
      border: 1px solid white;
      border-radius: 7px;
      background: transparent;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #30323a;
    }

    .forgot {
      display: block;
      margin: 25px 0 30px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
    }

    .divider {
      height: 1px;
      background: #3b3d45;
      margin-bottom: 18px;
    }

    .secondary-btn {
      width: 100%;
      height: 37px;
      margin: 6px 0;
      border: 0;
      border-radius: 7px;
      background: #3b3e48;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary-btn:hover {
      background: #454853;
    }

    .signup {
      display: block;
      margin-top: 36px;
      color: white;
      font-size: 16px;
      text-decoration: none;
    }

    .signup span {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Login Demo</h1>

    <p class="demo-text">
      Demo only — not affiliated with Roblox
    </p>

    <input
      type="text"
      placeholder="Username/Email/Phone"
      autocomplete="off"
    >

    <input
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button class="login-btn" type="button">
      Log In
    </button>

    <a href="#" class="forgot">
      Forgot Password or Username?
    </a>

    <div class="divider"></div>

    <button class="secondary-btn" type="button">
      Email Me a One-Time Code
    </button>

    <button class="secondary-btn" type="button">
      Quick Sign-in
    </button>

    <a href="#" class="signup">
      Don't have an account? <span>Sign Up</span>
    </a>

  </div>

</body>
</html>
```
