```html
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #18191c;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 380px;
      padding: 32px 28px;
      background: #232428;
      border-radius: 8px;
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 30px;
      font-weight: 700;
      color: white;
    }

    input {
      display: block;
      width: 100%;
      height: 44px;
      margin: 8px 0;
      padding: 0 13px;
      border: 1px solid #3f4148;
      border-radius: 6px;
      background: #000;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: #b8b8b8;
    }

    input:focus {
      border-color: #777;
    }

    .login-btn {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #000;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #111;
    }

    .forgot {
      display: block;
      margin: 22px 0 25px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .divider {
      height: 1px;
      background: #3a3b40;
      margin-bottom: 18px;
    }

    .secondary-btn {
      width: 100%;
      height: 42px;
      margin: 5px 0;
      border: 0;
      border-radius: 6px;
      background: #393a40;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary-btn:hover {
      background: #45464d;
    }

    .signup {
      display: block;
      margin-top: 28px;
      color: white;
      font-size: 14px;
      text-decoration: none;
    }

    .signup span {
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Log In</h1>

    <input
      type="text"
      placeholder="Username/Email/Phone"
      autocomplete="off"
    >

    <input
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button class="login-btn" type="button">
      Log In
    </button>

    <div class="forgot">
      Forgot Password or Username?
    </div>

    <div class="divider"></div>

    <button class="secondary-btn" type="button">
      Email Me a One-Time Code
    </button>

    <button class="secondary-btn" type="button">
      Quick Sign-in
    </button>

    <div class="signup">
      Don't have an account? <span>Sign Up</span>
    </div>

  </div>

</body>
</html>
```
